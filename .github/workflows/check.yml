name: ✅ Check
on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    checks: write

jobs:
    lint:
        name: 🔬 ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 📥 Download deps
              run: |
                  for attempt in 1 2 3; do
                    if npm ci; then
                      exit 0
                    fi
                    echo "npm ci attempt ${attempt} failed; retrying in 20s…"
                    sleep 20
                  done
                  exit 1

            - name: 🔬 Lint
              uses: wearerequired/lint-action@v2
              with:
                  eslint: true
                  eslint_args: "."
                  prettier: true
                  prettier_args: "--config ./.prettierrc.json \"**/*.{js,json,ts,tsx,css,md,html}\""

    test:
        name: 🔎 Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 📥 Download deps
              run: |
                  for attempt in 1 2 3; do
                    if npm ci; then
                      exit 0
                    fi
                    echo "npm ci attempt ${attempt} failed; retrying in 20s…"
                    sleep 20
                  done
                  exit 1

            - name: 🔎 Test
              run: make test-ci


    build:
        name: 🔨 Build
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 📥 Download deps
              run: |
                  for attempt in 1 2 3; do
                    if npm ci; then
                      exit 0
                    fi
                    echo "npm ci attempt ${attempt} failed; retrying in 20s…"
                    sleep 20
                  done
                  exit 1

            - name: 🔨 Build
              run: npm run build

            - name: 📦 Bundle size guard
              run: npm run check:bundle-size
